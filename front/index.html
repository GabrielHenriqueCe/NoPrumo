<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/app/view/assets/favicon.svg" />
    <title>No Prumo — Construction Management</title>
    <script>
      // Runs before the first paint so a dark-theme user never sees a white flash.
      // Same keys as PreferencesProvider; storage can be blocked, hence the try.
      try {
        var theme = localStorage.getItem('noprumo.theme')
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (localStorage.getItem('noprumo.language') === 'pt-BR') document.documentElement.lang = 'pt-BR'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/view/main.jsx"></script>
  </body>
</html>
